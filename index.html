<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads League | Standings</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/6f14ca658f9c288fd8ca8a79df5c658c97c8ac92/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --theme-color: #e10600; --f1-dark: #15151e; --f1-card: #1f1f27; --f1-hover: #2a2a35; }
        
        body { font-family: 'Titillium Web', sans-serif; background-color: var(--f1-dark); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--f1-card); width: 100%; max-width: 900px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;}
        
        .league-logo { max-height: 75px; margin: 0 auto 15px auto; display: block; border-radius: 6px; }
        
        h1 { 
            font-family: 'Formula1', sans-serif; 
            text-align: center; 
            text-transform: uppercase; 
            font-weight: normal; 
            margin: 0; 
        }
        .title-border { border-bottom: 2px solid var(--theme-color); padding-bottom: 10px; margin-bottom: 30px; }

        .standings-section { width: 100%; margin-bottom: 20px; }
        .standings-img { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #333; }
        
        /* Enlargeable Image Hover Effect */
        .clickable-img { cursor: zoom-in; transition: transform 0.2s, box-shadow 0.2s; }
        .clickable-img:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(225, 6, 0, 0.4); border-color: var(--theme-color); }

        /* Lightbox Modal Styles */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.9); 
            justify-content: center; 
            align-items: center;
            cursor: zoom-out;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            max-width: 95%; 
            max-height: 95%; 
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: zoomIn 0.2s ease-out;
        }
        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            h1 { font-size: 30px; }
        }

        @font-face {
            font-family: 'Formula1';
            src: url('https://raw.githubusercontent.com/f1ladsleague/landing-page/main/Formula1.ttf') format('truetype');
        }
    </style>
</head>
<body>

<div class="container">
    <a href="https://f1lads.com">
    <img src="https://raw.githubusercontent.com/f1ladsleague/sidebetting/e78422814abd6cb31f36f99696b471262536d272/Logo.png" alt="F1 Lads Logo" class="league-logo">
    </a>
    <h1 class="title-border">CHAMPIONSHIP STANDINGS</h1>

    <div class="standings-section">
        <img id="img-constructors" class="standings-img" alt="Constructors Standings">
    </div>

    <div class="standings-section">
        <img id="img-drivers" class="standings-img" alt="Drivers Standings">
    </div>

    <div class="standings-section">
        <img id="img-sprint-media" class="standings-img" alt="Sprint Race Media">
    </div>

    <div class="standings-section">
        <img id="img-sprint-result" class="standings-img clickable-img" alt="Sprint Race Result" onclick="openModal(this)">
    </div>

    <div class="standings-section">
        <img id="img-feature-media" class="standings-img" alt="Feature Race Media">
    </div>

    <div class="standings-section" style="margin-bottom: 0;">
        <img id="img-feature-result" class="standings-img clickable-img" alt="Feature Race Result" onclick="openModal(this)">
    </div>
</div>

<div id="image-modal" class="modal" onclick="closeModal()">
    <img class="modal-content" id="modal-img">
</div>

<script>
    const CONSTRUCTOR_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/constructors.png";
    const DRIVER_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/drivers.png";
    const SPRINT_MEDIA_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/sprint_race_result_media.png";
    const SPRINT_RESULT_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/sprint_race_result.png";
    const FEATURE_MEDIA_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/feature_race_result_media.png";
    const FEATURE_RESULT_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/feature_race_result.png";

    window.onload = () => {
        const cb = new Date().getTime(); // Bust the cache
        
        // Helper function to safely load image or hide parent if missing
        const loadImage = (elementId, url) => {
            const imgElement = document.getElementById(elementId);
            
            // If the image fails to load from GitHub, hide the section
            imgElement.onerror = function() {
                this.parentElement.style.display = 'none';
            };
            
            // Set the URL to trigger the download
            imgElement.src = `${url}?v=${cb}`;
        };

        // Load images in sequential order
        loadImage('img-constructors', CONSTRUCTOR_PHOTO_URL);
        loadImage('img-drivers', DRIVER_PHOTO_URL);
        loadImage('img-sprint-media', SPRINT_MEDIA_URL);
        loadImage('img-sprint-result', SPRINT_RESULT_URL);
        loadImage('img-feature-media', FEATURE_MEDIA_URL);
        loadImage('img-feature-result', FEATURE_RESULT_URL);
    };

    // Modal Lightbox Functions
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("modal-img");

    function openModal(element) {
        modal.style.display = "flex";
        modalImg.src = element.src; // Copies the exact image source to the modal
    }

    function closeModal() {
        modal.style.display = "none";
    }
</script>

</body>
</html>
