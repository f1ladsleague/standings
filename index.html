<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads League | Standings</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --theme-color: #00D7B6; --f1-dark: #15151e; --f1-card: #1f1f27; --f1-hover: #2a2a35; }
        
        body { font-family: 'Titillium Web', sans-serif; background-color: var(--f1-dark); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--f1-card); width: 100%; max-width: 900px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;}
        
        .league-logo { max-height: 75px; margin: 0 auto 15px auto; display: block; border-radius: 6px; }
        
        h1 { text-align: center; text-transform: uppercase; font-weight: 700; margin: 0; }
        .title-border { border-bottom: 2px solid var(--theme-color); padding-bottom: 10px; margin-bottom: 25px; transition: border-color 0.3s ease; }

        /* Toggle Buttons Centered */
        .toggle-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .login-toggle { display: flex; width: 100%; max-width: 500px; background: #1a1a21; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .login-toggle button { flex: 1; padding: 15px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 16px; letter-spacing: 1px;}
        .login-toggle button.toggle-active { background: var(--theme-color); color: white; }

        /* Standings Images - No Cropping */
        .standings-wrapper { width: 100%; display: flex; justify-content: center; }
        .standings-img { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .login-toggle button { font-size: 13px; padding: 12px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png" alt="F1 Lads Logo" class="league-logo">
    <h1 class="title-border" id="main-title">CHAMPIONSHIP STANDINGS</h1>

    <div class="toggle-container">
        <div class="login-toggle">
            <button id="btn-drivers" class="toggle-active" onclick="setStandingsMode('Drivers')">Drivers</button>
            <button id="btn-constructors" onclick="setStandingsMode('Constructors')">Constructors</button>
        </div>
    </div>

    <div class="standings-wrapper">
        <img id="img-drivers" src="" class="standings-img" alt="Drivers Standings">
        <img id="img-constructors" src="" class="standings-img hidden" alt="Constructors Standings">
    </div>
</div>

<script>
    const DRIVER_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/a05657d7f061be7f8ec40e83781a00fb7dd69062/Standings_Photos/drivers.png";
    const CONSTRUCTOR_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/a05657d7f061be7f8ec40e83781a00fb7dd69062/Standings_Photos/constructors.png";

    window.onload = () => {
        // Cache buster ensures the browser doesn't show an old version of the image
        const cb = new Date().getTime();
        document.getElementById('img-drivers').src = `${DRIVER_PHOTO_URL}?v=${cb}`;
        document.getElementById('img-constructors').src = `${CONSTRUCTOR_PHOTO_URL}?v=${cb}`;
    };

    function setStandingsMode(mode) {
        const btnDrivers = document.getElementById('btn-drivers');
        const btnConstructors = document.getElementById('btn-constructors');
        const imgDrivers = document.getElementById('img-drivers');
        const imgConstructors = document.getElementById('img-constructors');
        const mainTitle = document.getElementById('main-title');

        if (mode === 'Drivers') {
            btnDrivers.classList.add('toggle-active');
            btnConstructors.classList.remove('toggle-active');
            imgDrivers.classList.remove('hidden');
            imgConstructors.classList.add('hidden');
            document.documentElement.style.setProperty('--theme-color', '#00D7B6'); // Teal
        } else {
            btnConstructors.classList.add('toggle-active');
            btnDrivers.classList.remove('toggle-active');
            imgConstructors.classList.remove('hidden');
            imgDrivers.classList.add('hidden');
            document.documentElement.style.setProperty('--theme-color', '#e10600'); // Red
        }
    }
</script>

</body>
</html>
