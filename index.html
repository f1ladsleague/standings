<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads League | Standings</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Theme set strictly to Constructor Red */
        :root { --theme-color: #e10600; --f1-dark: #15151e; --f1-card: #1f1f27; --f1-hover: #2a2a35; }
        
        body { font-family: 'Titillium Web', sans-serif; background-color: var(--f1-dark); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--f1-card); width: 100%; max-width: 900px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;}
        
        .league-logo { max-height: 75px; margin: 0 auto 15px auto; display: block; border-radius: 6px; }
        
        h1 { text-align: center; text-transform: uppercase; font-weight: 700; margin: 0; }
        .title-border { border-bottom: 2px solid var(--theme-color); padding-bottom: 10px; margin-bottom: 30px; }

        h2 { text-align: center; text-transform: uppercase; color: var(--theme-color); font-size: 20px; margin-bottom: 15px; letter-spacing: 1px; }

        .standings-section { width: 100%; margin-bottom: 40px; }
        .standings-img { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #333; }
        
        @media (max-width: 480px) {
            .container { padding: 15px; }
            h1 { font-size: 22px; }
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png" alt="F1 Lads Logo" class="league-logo">
    <h1 class="title-border">CHAMPIONSHIP STANDINGS</h1>

    <div class="standings-section">
        <h2>Constructor Standings</h2>
        <img id="img-constructors" src="" class="standings-img" alt="Constructors Standings">
    </div>

    <div class="standings-section">
        <h2>Driver Standings</h2>
        <img id="img-drivers" src="" class="standings-img" alt="Drivers Standings">
    </div>
</div>

<script>
    const DRIVER_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/drivers.png";
    const CONSTRUCTOR_PHOTO_URL = "https://raw.githubusercontent.com/f1ladsleague/standings/main/Standings_Photos/constructors.png";

    window.onload = () => {
        const cb = new Date().getTime();
        document.getElementById('img-drivers').src = `${DRIVER_PHOTO_URL}?v=${cb}`;
        document.getElementById('img-constructors').src = `${CONSTRUCTOR_PHOTO_URL}?v=${cb}`;
    };
</script>

</body>
</html>
