<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Lads League | Standings</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --theme-color: #00D7B6; --f1-dark: #15151e; --f1-card: #1f1f27; --f1-hover: #2a2a35; }
        
        body { font-family: 'Titillium Web', sans-serif; background-color: var(--f1-dark); color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: var(--f1-card); width: 100%; max-width: 800px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px;}
        
        .league-logo { max-height: 75px; margin: 0 auto 15px auto; display: block; border-radius: 6px; }
        
        h1 { text-align: center; text-transform: uppercase; font-weight: 700; margin: 0; }
        .login-h1-border { border-bottom: 2px solid var(--theme-color); padding-bottom: 10px; margin-bottom: 25px; transition: border-color 0.3s ease; }

        /* Toggle Buttons */
        .login-toggle { display: flex; margin-bottom: 25px; background: #1a1a21; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .login-toggle button { flex: 1; padding: 15px; border: none; background: transparent; color: #888; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; font-size: 16px; letter-spacing: 1px;}
        .login-toggle button.toggle-active { background: var(--theme-color); color: white; }

        /* Standings Images */
        .standings-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; }
        .standings-img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .login-toggle button { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <img src="https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Logo.png" alt="F1 Lads Logo" class="league-logo">
    <h1 class="login-h1-border">CHAMPIONSHIP STANDINGS</h1>

    <div class="login-toggle">
        <button id="btn-drivers" class="toggle-active" onclick="setStandingsMode('Drivers')">Driver Standings</button>
        <button id="btn-constructors" onclick="setStandingsMode('Constructors')">Constructor Standings</button>
    </div>

    <div class="standings-wrapper">
        <img id="img-drivers" src="" class="standings-img" alt="Drivers Standings">
        <img id="img-constructors" src="" class="standings-img hidden" alt="Constructors Standings">
    </div>
</div>

<script>
    // CACHE BUSTER: Forces the browser to grab the newest uploaded image instead of a saved old one
    window.onload = () => {
        const cacheBust = new Date().getTime();
        
        // Ensure you create a folder in your GitHub repo called "Standings_Photos"
        document.getElementById('img-drivers').src = `https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Standings_Photos/drivers.jpg?v=${cacheBust}`;
        document.getElementById('img-constructors').src = `https://raw.githubusercontent.com/f1ladsleague/sidebetting/main/Standings_Photos/constructors.jpg?v=${cacheBust}`;
    };

    function setStandingsMode(mode) {
        const btnDrivers = document.getElementById('btn-drivers');
        const btnConstructors = document.getElementById('btn-constructors');
        const imgDrivers = document.getElementById('img-drivers');
        const imgConstructors = document.getElementById('img-constructors');

        if (mode === 'Drivers') {
            btnDrivers.classList.add('toggle-active');
            btnConstructors.classList.remove('toggle-active');
            imgDrivers.classList.remove('hidden');
            imgConstructors.classList.add('hidden');
            document.documentElement.style.setProperty('--theme-color', '#00D7B6'); // Mercedes Teal
        } else {
            btnConstructors.classList.add('toggle-active');
            btnDrivers.classList.remove('toggle-active');
            imgConstructors.classList.remove('hidden');
            imgDrivers.classList.add('hidden');
            document.documentElement.style.setProperty('--theme-color', '#e10600'); // Ferrari Red
        }
    }
</script>

</body>
</html>
